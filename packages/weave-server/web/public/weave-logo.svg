<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="weave">
  <!-- 应用图标：深色圆角方 + 交叉光带 W。几何与界面里的 WeaveMark 同一份（24 空间缩放 1.22），
       色值写死以便同时作 favicon 与 <img>：favicon 拿不到页面主题变量。 -->
  <defs>
    <linearGradient id="a" x1="6" y1="8" x2="26" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b8a0ff" />
      <stop offset=".48" stop-color="#237dff" />
      <stop offset="1" stop-color="#00d7ff" />
    </linearGradient>
    <linearGradient id="b" x1="6" y1="8" x2="26" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#32e4ff" />
      <stop offset=".55" stop-color="#176dff" />
      <stop offset="1" stop-color="#8b5cff" />
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.5" />
    </filter>
  </defs>
  <rect width="32" height="32" rx="8" fill="#080b14" />
  <rect x=".5" y=".5" width="31" height="31" rx="7.5" fill="none" stroke="#272c3c" />
  <g transform="translate(1.36 2.45) scale(1.22)" fill="none" stroke-width="2.3" stroke-linecap="round">
    <g filter="url(#glow)" opacity=".75">
      <path d="M4.97 6.19L9.47 14.72Q10.13 16.03 11.25 14.72L16.31 6.19" stroke="url(#a)" />
      <path d="M7.78 6.19L12.75 14.72Q13.5 16.03 14.53 14.72L19.03 6.19" stroke="url(#b)" />
    </g>
    <path d="M4.97 6.19L9.47 14.72Q10.13 16.03 11.25 14.72L16.31 6.19" stroke="url(#a)" />
    <path d="M7.78 6.19L12.75 14.72Q13.5 16.03 14.53 14.72L19.03 6.19" stroke="url(#b)" />
  </g>
</svg>
