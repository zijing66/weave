<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <!-- PWA：从主屏图标启动时 standalone（无地址栏）。普通标签页访问完全不受影响——
         manifest 与 apple-* 只是安装入口的元数据。iOS 走 apple-* 前缀（Safari 不读
         manifest 的 display），Android/桌面走 manifest。 -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Weave" />
    <!-- 首屏落主题：规则与 src/lib/theme.ts 同源（dark/light 显式存过用存值，
         auto 或没存过跟系统），在这里跑是为了样式表生效前就定下 data-theme，
         避免闪一下白底。 -->
    <script>
      (function () {
        var saved = null;
        try {
          saved = localStorage.getItem('weave:theme');
        } catch (e) {}
        var light = saved === 'light' || (saved !== 'dark' && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches);
        document.documentElement.dataset.theme = light ? 'light' : 'dark';
      })();
    </script>
    <!-- 首屏落界面缩放：规则与 src/lib/font-scale.ts 同源（85–125，缺省 100 = 不缩），
         React 挂载前定下 zoom，避免首屏尺寸跳一下。 -->
    <script>
      (function () {
        var s = null;
        try {
          s = Number(localStorage.getItem('weave:fontScale'));
        } catch (e) {}
        if (s >= 85 && s <= 125 && s !== 100) document.documentElement.style.zoom = String(s / 100);
      })();
    </script>
    <title>Weave Dashboard</title>
    <!-- favicon：public/ 下的 SVG，不经 JS、首屏即生效（换图就抬 ?v，缓存口令） -->
    <link rel="icon" type="image/svg+xml" href="/weave-logo.svg?v=4" />
    <!-- Powerline glyphs load before first paint — no tofu flash in the preview -->
    <link rel="preload" href="/fonts/WeaveNerdMono-Regular.woff?v=2" as="font" type="font/woff" crossorigin />
    <link rel="preload" href="/fonts/WeaveNerdMono-Bold.woff?v=2" as="font" type="font/woff" crossorigin />
  </head>
  <body class="bg-neutral-950 text-neutral-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
