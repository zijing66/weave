<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>weave-pet-window</title>
    <style>
      /* 透明窗的前提：body 不可见区域必须透出去（WebView2 DefaultBackgroundColor=Transparent） */
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        user-select: none;
        cursor: grab;
      }
      body:active {
        cursor: grabbing;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      /* 提醒气泡：宠物头顶浮一层，状态变迁时出现、几秒后淡出 */
      #bubble {
        position: absolute;
        top: 4px;
        left: 50%;
        transform: translateX(-50%);
        max-width: 92%;
        box-sizing: border-box;
        padding: 3px 8px;
        border-radius: 8px;
        background: rgba(23, 23, 23, 0.92);
        color: #fafafa;
        font: 11px/1.4 system-ui, sans-serif;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        opacity: 0;
        transition: opacity 0.25s ease;
        pointer-events: none;
      }
      #bubble.show {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="bubble"></div>
    <script type="module" src="/src/pet/main.ts"></script>
  </body>
</html>
